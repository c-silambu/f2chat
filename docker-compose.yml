version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: vibepulse-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - vibepulse-network

  redis:
    image: redis:7-alpine
    container_name: vibepulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vibepulse-network

  coturn:
    image: coturn/coturn:latest
    container_name: vibepulse-turn
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49152-65535:49152-65535/udp"
    environment:
      - TURN_PORT=3478
      - REALM=vibepulse.local
      - USERNAME=vibepulseuser
      - PASSWORD=vibepulsepass
    command:
      - "-n"
      - "--log-file=stdout"
      - "--min-port=49152"
      - "--max-port=65535"
      - "--user=vibepulseuser:vibepulsepass"
      - "--realm=vibepulse.local"
    networks:
      - vibepulse-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vibepulse-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:5173
      - MONGODB_URI=mongodb://mongodb:27017/vibepulse
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_vibepulse_jwt_key_change_in_production_32chars!
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123_secure_vibepulse
    depends_on:
      - mongodb
      - redis
    networks:
      - vibepulse-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: vibepulse-client
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - VITE_SOCKET_URL=http://localhost:5000
      - VITE_STUN_SERVER=stun:stun.l.google.com:19302
    depends_on:
      - server
    networks:
      - vibepulse-network

volumes:
  mongo_data:
  redis_data:

networks:
  vibepulse-network:
    driver: bridge
